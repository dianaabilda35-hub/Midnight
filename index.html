<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weak Hero OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone-frame">
        <!-- Экран, куда приложение загружает все вкладки -->
        <div id="app-screen"></div>

        <!-- Нижняя панель навигации -->
        <div class="nav-bar">
            <div class="nav-item active" data-tab="chats">
                <span>💬</span>
                <span style="font-size: 10px;">Chats</span>
            </div>
            <div class="nav-item" data-tab="feed">
                <span>📰</span>
                <span style="font-size: 10px;">Feed</span>
            </div>
            <div class="nav-item" data-tab="calls">
                <span>📞</span>
                <span style="font-size: 10px;">Calls</span>
            </div>
            <div class="nav-item" data-tab="settings">
                <span>⚙️</span>
                <span style="font-size: 10px;">Settings</span>
            </div>
        </div>
    </div>

    <!-- ВАЖНО: characters.js должен стоять СТРОГО перед apps.js -->
    <script src="characters.js"></script>
    <script src="apps.js"></script>
</body>
</html>
