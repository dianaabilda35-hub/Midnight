<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDNIGHT CHAMPAGNE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone-container">
        <!-- Status Bar -->
        <div class="status-bar">
            <span class="time">23:04</span>
            <div class="status-icons">
                <span>5G</span>
                <div class="battery"></div>
            </div>
        </div>

        <!-- Main Screen Content -->
        <div id="app-screen" class="screen-content"></div>

        <!-- Bottom Navigation Bar -->
        <nav class="nav-bar">
            <button class="nav-item active" data-tab="chats">
                <span class="icon">💬</span>
                <span>Chats</span>
            </button>
            <button class="nav-item" data-tab="feed">
                <span class="icon">📰</span>
                <span>Feed</span>
            </button>
            <button class="nav-item" data-tab="calls">
                <span class="icon">📞</span>
                <span>Calls</span>
            </button>
            <button class="nav-item" data-tab="settings">
                <span class="icon">⚙️</span>
                <span>Settings</span>
            </button>
        </nav>
    </div>

    <!-- Scripts -->
    <script src="characters.js"></script>
    <script src="apps.js"></script>
</body>
</html>
